name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-14
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (webkit, gtk, appimage tooling)
        if: runner.os == 'Linux'
        run: |
          # The runner image ships a packages.microsoft.com source we need
          # nothing from, and it answers 403 often enough to fail a release.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: npm ci

      - name: Build sidecars (PyInstaller backend, static ffmpeg + ffprobe)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          python scripts/build_sidecars.py

      - name: Build app and publish to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without this the build still works,
          # but it produces nothing the installed app will accept as an update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Empty when the key was generated without one, which is the case.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tunefold ${{ github.ref_name }}"
          releaseBody: |
            Desktop builds for Linux (.deb, .AppImage, .rpm), macOS (.dmg) and Windows (.msi, .exe).
            ffmpeg and ffprobe are bundled; nothing else to install.

            Installed copies update themselves from here: the AppImage, the
            Windows installers and the macOS app. A .deb or .rpm is updated by
            apt or dnf instead.
          releaseDraft: true
          prerelease: false
          # latest.json is what the installed app reads to find this release.
          includeUpdaterJson: true

<!doctype html>
<!--
  The 1280x640 card uploaded under GitHub -> Settings -> General -> Social preview.
  Render it after `npm install` (it uses the bundled Inter) with:

      chromium --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
               --window-size=1280,640 --allow-file-access-from-files \
               --screenshot=docs/social-preview.png docs/social-preview.html

  The right-hand strip is the artist-folding panel, read out of the image this
  page renders to, so re-rendering keeps it and only redraws the text.
-->
<html><head><meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Inter Variable';
    font-style: normal;
    font-display: block;
    font-weight: 100 900;
    src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2-variations');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    background: #0e0f12; color: #e8eaf0;
    font-family: 'Inter Variable', sans-serif; -webkit-font-smoothing: antialiased;
    position: relative; overflow: hidden;
  }
  .panel {
    position: absolute; top: 0; left: 596px; width: 684px; height: 640px;
    background-image: url('social-preview.png');
    background-position: -596px 0;
  }
  .left { position: absolute; top: 0; left: 0; width: 600px; height: 640px; padding: 108px 0 0 80px;
          background: linear-gradient(90deg, #0e0f12 78%, rgba(14,15,18,0.92) 100%); z-index: 2; }
  .kicker { color: #1ed760; font-size: 15px; font-weight: 600; letter-spacing: 0.14em; }
  h1 { font-size: 100px; font-weight: 500; letter-spacing: -0.035em; line-height: 1; margin: 26px 0 0 -6px; }
  .lead { font-size: 29px; font-weight: 400; line-height: 1.36; letter-spacing: -0.015em; margin-top: 28px;
          max-width: 470px; text-wrap: balance; }
  .sub { font-size: 24px; font-weight: 400; line-height: 1.34; color: #8b91a0; margin-top: 30px; max-width: 460px; }
  .url { font-size: 20px; color: #6d7382; margin-top: 44px; }
</style></head>
<body>
  <div class="panel"></div>
  <div class="left">
    <div class="kicker">MIT &nbsp;·&nbsp; LINUX &nbsp;·&nbsp; MACOS &nbsp;·&nbsp; WINDOWS</div>
    <h1>Tunefold</h1>
    <div class="lead">Spotify, Deezer and Apple&nbsp;Music playlists into neatly tagged audio files.</div>
    <div class="sub">Smart artist folding, so one band lands in one folder — not three.</div>
    <div class="url">github.com/Hercegman/tunefold</div>
  </div>
</body></html>
